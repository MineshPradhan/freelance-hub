<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Assessment Platform{% endblock %} · Assessment Platform</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">Assessment <span>Platform</span></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> Assessment Platform. All rights reserved.</div>
  </footer>

  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
