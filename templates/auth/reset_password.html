{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="card">
    <h1>Choose a new password</h1>
    <div id="alert" class="alert hidden" role="alert"></div>
    <form id="form" novalidate>
      <div class="field"><label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="10" maxlength="72">
        <div class="hint">At least 10 characters, with letters and numbers.</div></div>
      <div class="field"><label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" autocomplete="new-password" required></div>
      <button class="btn block" type="submit" id="submit">Update password</button>
    </form>
    <p class="center small" style="margin:18px 0 0"><a href="/auth/forgot-password">Request a new link</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  var TOKEN = {{ token|tojson }};
  var form = document.getElementById("form"), alertEl = document.getElementById("alert"), btn = document.getElementById("submit");
  if (!TOKEN) { form.classList.add("hidden"); App.showAlert(alertEl, "This reset link is missing its token. Please use the link from your email or request a new one.", "warn"); }
  form.addEventListener("submit", async function (e) {
    e.preventDefault(); App.hideAlert(alertEl);
    var pw = document.getElementById("password").value;
    if (pw.length < 10 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return App.showAlert(alertEl, "Password must be at least 10 characters and include letters and numbers.", "error");
    if (pw !== document.getElementById("confirm").value) return App.showAlert(alertEl, "Passwords do not match.", "error");
    App.setBusy(btn, true, "Updating…");
    try { await App.api("/api/auth/reset-password", { method: "POST", body: { token: TOKEN, password: pw } }); location.href = "/login?reset=1"; }
    catch (err) { App.showAlert(alertEl, err.message, "error"); App.setBusy(btn, false); }
  });
</script>
{% endblock %}
