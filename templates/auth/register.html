{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="card">
    <h1>Create your account</h1>
    <p class="muted">You will receive an email to verify your address.</p>
    <div id="alert" class="alert hidden" role="alert"></div>

    <form id="form" novalidate>
      <div class="field"><label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" autocomplete="name" required minlength="2" maxlength="100"></div>
      <div class="field"><label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="10" maxlength="72">
        <div class="hint">At least 10 characters, with letters and numbers.</div></div>
      <div class="field"><label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" required></div>
      <div class="field"><label class="check"><input type="checkbox" id="terms" required>
        <span>I agree to the Terms of Use and Privacy Policy.</span></label></div>
      <button class="btn block" type="submit" id="submit">Create account</button>
    </form>
    <p class="center small muted" style="margin:18px 0 0">Already registered? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  var form = document.getElementById("form"), alertEl = document.getElementById("alert"), btn = document.getElementById("submit");
  form.addEventListener("submit", async function (e) {
    e.preventDefault(); App.hideAlert(alertEl);
    var f = form.elements;
    if (!f.full_name.value.trim() || !f.email.checkValidity()) return App.showAlert(alertEl, "Please enter your name and a valid email address.", "error");
    if (f.password.value.length < 10 || !/[A-Za-z]/.test(f.password.value) || !/\d/.test(f.password.value))
      return App.showAlert(alertEl, "Password must be at least 10 characters and include letters and numbers.", "error");
    if (f.password.value !== document.getElementById("confirm").value) return App.showAlert(alertEl, "Passwords do not match.", "error");
    if (!document.getElementById("terms").checked) return App.showAlert(alertEl, "Please accept the terms to continue.", "error");
    App.setBusy(btn, true, "Creating account…");
    try {
      var res = await App.api("/api/auth/register", { method: "POST", body: { full_name: f.full_name.value, email: f.email.value, password: f.password.value } });
      form.classList.add("hidden");
      App.showAlert(alertEl, res.message + " Check your inbox (and spam folder) for the verification link.", "success");
    } catch (err) { App.showAlert(alertEl, err.message, "error"); App.setBusy(btn, false); }
  });
</script>
{% endblock %}
