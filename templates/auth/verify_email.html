{% extends "base.html" %}
{% block title %}Verify email{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="card center">
    <h1>Email verification</h1>
    <div id="status" class="loading-block">Verifying your email…</div>
    <div id="done" class="hidden"><a class="btn" href="/login">Continue to log in</a></div>
    <div id="resend" class="hidden" style="text-align:left">
      <p class="small muted">Need a new link? Enter your email below.</p>
      <form id="resend-form" novalidate>
        <div class="field"><input type="email" id="email" placeholder="you@example.com" required></div>
        <button class="btn block" type="submit">Send a new verification email</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  var TOKEN = {{ token|tojson }};
  var statusEl = document.getElementById("status");
  function show(msg, type) { statusEl.className = "alert " + type; statusEl.style.whiteSpace = "pre-line"; statusEl.textContent = msg; }
  (async function () {
    if (!TOKEN) { show("No verification token found. Open the link from your email, or request a new one below.", "warn"); document.getElementById("resend").classList.remove("hidden"); return; }
    try {
      var r = await App.api("/api/auth/verify-email", { method: "POST", body: { token: TOKEN } });
      show(r.message, "success"); document.getElementById("done").classList.remove("hidden");
    } catch (err) { show(err.message, "error"); document.getElementById("resend").classList.remove("hidden"); }
  })();
  document.getElementById("resend-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    try { var r = await App.api("/api/auth/resend-verification", { method: "POST", body: { email: document.getElementById("email").value } }); show(r.message, "success"); }
    catch (err) { show(err.message, "error"); }
  });
</script>
{% endblock %}
