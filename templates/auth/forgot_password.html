{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your account email and we'll send you a reset link.</p>
    <div id="alert" class="alert hidden" role="alert"></div>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required></div>
      <button class="btn block" type="submit" id="submit">Send reset link</button>
    </form>
    <p class="center small" style="margin:18px 0 0"><a href="/login">Back to log in</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  var form = document.getElementById("form"), alertEl = document.getElementById("alert"), btn = document.getElementById("submit");
  form.addEventListener("submit", async function (e) {
    e.preventDefault(); App.hideAlert(alertEl);
    if (!form.elements.email.checkValidity()) return App.showAlert(alertEl, "Enter a valid email address.", "error");
    App.setBusy(btn, true, "Sending…");
    try { var r = await App.api("/api/auth/forgot-password", { method: "POST", body: { email: form.elements.email.value } }); App.showAlert(alertEl, r.message, "success"); form.classList.add("hidden"); }
    catch (err) { App.showAlert(alertEl, err.message, "error"); App.setBusy(btn, false); }
  });
</script>
{% endblock %}
